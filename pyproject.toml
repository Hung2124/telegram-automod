[project]
name = "telegram-automod"
version = "0.1.0"
description = "AI-powered moderation bot for Telegram groups"
authors = [{ name = "Hung Nguyen", email = "Hung2124@users.noreply.github.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[webhooks]>=21.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "openai>=1.30",
    "anthropic>=0.30",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "stripe>=9.0",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[project.scripts]
automod = "automod.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
